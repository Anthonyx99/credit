name: credit

services:
  app:
    build:
      context: .
      target: dev
    image: credit-dev
    init: true
    tty: true
    stdin_open: true
    command: ['pnpm', 'dev', '--host', '0.0.0.0']
    ports:
      - '${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: '3000'
      NUXT_TELEMETRY_DISABLED: '1'
      CHOKIDAR_USEPOLLING: '${CHOKIDAR_USEPOLLING:-false}'
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
